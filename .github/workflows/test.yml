name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run -s export:python && git diff --exit-code python/gulf_saathi_harness/lexicon.json
      - run: pip install fastapi httpx
      - run: python python/test_harness.py
      - run: python python/test_transcribe_call.py
      - run: npx tsx scripts/parity.ts
