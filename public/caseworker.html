<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caseworker desk · Gulf Saathi</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f3ed;color:#192e29;font:16px/1.55 "DM Sans",system-ui,sans-serif}header{background:#173f36;color:white;padding:1rem max(5vw,1rem);display:flex;align-items:center;justify-content:space-between}main{max-width:65rem;margin:2rem auto;padding:0 1rem}h1,h2,h3{line-height:1.2}section,article{background:#fff;padding:1.25rem 1.5rem;border:1px solid #d8dfd8;border-radius:10px;margin:1rem 0}label{display:block;margin:.6rem 0}input,select,textarea,button{font:inherit;padding:.45rem .7rem;border-radius:5px;border:1px solid #839a90}button{background:#21624e;color:white;cursor:pointer}textarea{display:block;width:100%;min-height:4rem}li{margin:.55rem 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}#msg{font-weight:600}button:disabled{opacity:.55}
</style>
<header><strong>Gulf Saathi</strong><span>Caseworker desk</span></header><main>
<h1>Worker cases</h1><form id="login"><label>Caseworker access key <input id="secret" type="password" required autocomplete="off"></label><button>Open desk</button></form>
<p id="msg" role="status"></p><div id="desk" hidden><button id="logout">Lock desk</button><section><h2>Case queue</h2><label>Risk <select id="level"><option value="">All levels</option><option>critical</option><option>high</option></select></label><label>Status <select id="status"><option>alert</option><option>closed</option><option value="">All cases</option></select></label><button id="reload">Refresh</button><ul id="cases"></ul></section>
<section id="detail" hidden><h2 id="caseTitle"></h2><p id="handoff"></p><form id="claimForm"><label>Caseworker name <input id="claimName" required maxlength="100"></label><button>Acknowledge case</button></form>
<p id="smsState"></p><form id="receiptForm"><label>Request ID from MSG91 delivery report <input id="receiptId" required></label><label>Report status <select id="receiptStatus"><option>delivered</option><option>failed</option></select></label><label>Checked by <input id="receiptBy" required maxlength="100"></label><button>Record delivery check</button></form>
<details><summary>Case file</summary><pre id="file"></pre></details><h3>Caseworker notes</h3><ul id="notes"></ul><form id="noteForm"><label>Add note<textarea id="note" required maxlength="4000"></textarea></label><button>Save note</button></form>
<form id="closeForm"><label>Outcome <select id="outcome"><option>solved</option><option>partly</option><option>not</option><option>withdrawn</option></select></label><button>Close case</button></form>
<h3>Interpreter review</h3><form id="translate"><label>Source language <select id="from"><option value="te">Telugu → Arabic</option><option value="ar">Arabic → Telugu</option></select></label><label>Consented message<textarea id="source" required maxlength="3000"></textarea></label><button>Request translation</button></form><div id="reviews"></div></section></div></main><script type="module" src="/caseworker.js"></script></html>
